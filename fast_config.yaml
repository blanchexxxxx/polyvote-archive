# Fast-market service.  The committed configuration is intentionally shadow-only.
# Live trading additionally requires POLYVOTE_FAST_LIVE=YES and wallet credentials.
mode: shadow
asset: BTC
window_seconds: 300

endpoints:
  gamma: https://gamma-api.polymarket.com
  clob: https://clob.polymarket.com
  market_ws: wss://ws-subscriptions-clob.polymarket.com/ws/market
  rtds_ws: wss://ws-live-data.polymarket.com
  geoblock: https://polymarket.com/api/geoblock

feeds:
  chainlink_symbol: btc/usd
  binance_symbol: btcusdt
  reconnect_max_seconds: 20
  state_flush_ms: 1000
  http_probe_seconds: 5
  prefetch_seconds: 20

strategy:
  min_seconds_after_open: 8
  min_seconds_to_close: 20
  max_seconds_to_close: 270
  max_clob_age_ms: 500
  max_chainlink_age_ms: 1500
  max_binance_age_ms: 1000
  max_chainlink_source_age_ms: 3000
  max_binance_source_age_ms: 2000
  max_source_skew_seconds: 3
  max_spread: 0.08
  min_net_edge: 0.04
  slippage_buffer: 0.01
  min_sigma_per_sqrt_second: 0.000035
  basis_alpha: 0.08
  variance_alpha: 0.08
  execution_slippage_ticks: 1
  entry_cooldown_seconds: 12

risk:
  initial_capital_usd: 10.0
  max_order_usd: 4.25
  max_window_usd: 8.5
  max_daily_loss_usd: 3.5
  max_orders_per_window: 3
  minimum_cash_reserve_usd: 1.0

live:
  enabled: false
  expected_country: IE
  chain_id: 137
  signature_type: 1
  funder_env: POLYVOTE_FUNDER
  order_type: FAK

storage:
  state: fast_state.json
  decisions: fast_decisions_v4.jsonl
  ledger: fast_shadow_v4.db
  reviews: fast_reviews_v4.json
