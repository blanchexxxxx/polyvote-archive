# polyvote 配置 —— 模型只在这里改，别处不存在第二份模型清单
#
# 这个文件是刻意做成"单一注册表"的。mory 那边模型散在 8+ 处
# (backend allowlist / frontend 菜单 / forge 窗口表 / cron 硬编码),
# 结果 Fable 5 上线时前端有按钮、后端 allowlist 没加,点了直接 400。
# 详见 backend/api/routers/chat.py:371-373 的注释。这里不重复那个坑。

# ── 研究员 ────────────────────────────────────────────────
# 查资料这个活跟判断分开,交给便宜模型干一次,三个投票人共用同一份事实。
#
# 为什么不让三个投票人各查各的 (第一版就是那样):
#   1. 三倍成本 —— 实测 haiku $0.126 vs sonnet-5 $0.725,产出没差
#   2. 更要命的是:三家查到的事实不一样,那三票的分歧到底是"判断不同"
#      还是"看到的东西不同"根本分不清。共识投票的价值前提是大家在
#      同一份证据上做判断,否则测的是搜索引擎的随机性。
#
# 代价:研究员漏掉的东西三个投票人一起瞎。这是拿多样性换一致性,
# 换得值 —— 判断分歧才是我们想测的信号。
researcher:
  engine: claude
  model: claude-haiku-4-5
  effort: low

# ── 投票团 ────────────────────────────────────────────────
# 三个投票人拿到同一份事实简报 + 同一个问题,各自独立判断。
# 它们没有工具 —— 事实已经摆好了,它们的活是判断,不是搜索。
# 想加/减投票人,直接改这个列表,代码不用动。
voters:
  - id: opus
    engine: claude
    model: claude-opus-4-8
    effort: medium
  - id: fable
    engine: claude
    model: claude-fable-5
    effort: medium
  - id: sol
    engine: codex
    model: gpt-5.6-sol
    effort: null          # codex 的 effort 传法待验,先不传

# ── 最终决策者 ────────────────────────────────────────────
# 拿到全部选票 + 原始市场数据后拍板的那个。
decider:
  engine: claude
  model: claude-fable-5
  effort: high

# ── 已知可用模型 ──────────────────────────────────────────
# 两个作用:
#   1. 软校验 —— 填了不在这里的模型只打 WARNING 不拒绝(硬 allowlist 正是
#      mory 那个 400 bug 的成因)。模型升级时这张表更不更新都不影响运行。
#   2. 喂观测台的模型选择下拉 —— 你在前端能点的就是这些。
#
# note 里标了实测的成本档位,选的时候有个参考(2026-07-18 实测:同样负载下
# fable-5 比 opus-4-8 贵约一倍,主要贵在 output 计价)。想加新模型,往对应
# engine 下面加一行即可,前端下拉自动出现。
known_models:
  claude:
    - model: claude-haiku-4-5
      note: 最便宜 · 适合研究员
    - model: claude-fable-5
      note: 快 · output 计价偏高
    - model: claude-sonnet-5
      note: 中档
    - model: claude-opus-4-8
      note: 强 · 实测反而比 fable 便宜
    - model: claude-opus-4-7
      note: 上一代 opus
    - model: claude-sonnet-4-6
      note: 上一代 sonnet
  codex:
    - model: gpt-5.6-sol
      note: 默认 · 无缓存分项
    - model: gpt-5.6-terra
      note: ""
    - model: gpt-5.6-luna
      note: ""

# ── 引擎调用参数 ──────────────────────────────────────────
engines:
  claude:
    bin: claude
    timeout_s: 180
    # 这三个是压成本的关键,别删:
    #   --setting-sources ""  → 不加载用户设置/MCP (省 110k cache read)
    #   --allowedTools ""     → 不发工具定义 (cache_creation 15.7k → 3.5k)
    #   --system-prompt       → 换掉 Claude Code 的 agentic 系统提示
    # 实测: 带这三个 $0.17/次, 不带 $0.73/次
  codex:
    bin: codex
    timeout_s: 240

# ── 风控 (代码层硬上限,LLM 无权突破) ──────────────────────
risk:
  dry_run: true                      # ← 实盘总开关。true = 只记录不下单
  max_notional_per_trade_usd: 5.0
  max_notional_per_day_usd: 50.0
  max_position_per_market_usd: 20.0
  max_open_positions: 5
  min_decider_confidence: 5          # 决策者置信度下限。学习档 5;实盘拧回 6
  min_vote_agreement: 2              # 至少 N 票同向 (ABSTAIN 不计)
  max_price_for_buy: 0.90            # 不追已定盘的票
  min_price_for_buy: 0.05

  # ⚠ 当前是 dry-run 学习档(偏松)。102 轮全 SKIP 之后的教训:模拟单亏了
  # 不花钱,但一单不下就零信息 —— dry-run 里过度保守是最差策略。
  # 开实盘前把这三个值拧回严档: min_edge 0.08 / min_voter_confidence 5 /
  # min_decider_confidence 6。

  # 一票的 fair_price 要偏离市价多少才算一票。
  # 实盘建议 0.08;学习档 0.06 —— 实测里三家常聚在 5-7 个点的 edge 上,
  # 0.08 把这些全掐成弃权,决策者永远收不到真实票型。
  min_edge: 0.06

  # 单票信心下限。低于此值的票强制弃权,不管 edge 多大。
  # 绝对下限是 4,再低"无知会被当成 edge":
  #   模型对某事一无所知 → 老实报 fair=0.500 conf=1
  #   市价 0.411 → edge 超阈值 → 被推导成 YES 票
  # 学习档用 4(LeBron 盘三家 conf 4/4/6 被 5 拦掉两票,票型从未成形);
  # 实盘建议拧回 5。
  min_voter_confidence: 4

  # 投票人估值分歧上限。三个模型分别报 0.2/0.5/0.8 时平均值 0.5 毫无意义,
  # 这种情况必须拒单而不是照着均值下注。
  max_fair_price_spread: 0.25

  # desk 的 Kelly 定仓(操盘手研究嫁接,2026-07-19)。
  # size = bankroll × f* × kelly_fraction × 平均信心/10,再受单笔上限约束。
  # 疑虑缩仓位,不弃权 —— 只有 edge < min_edge 才产生零。
  paper_bankroll_usd: 100.0
  kelly_fraction: 0.25               # ¼Kelly,全行业默认;全 Kelly 会破产

# ── 研究阶段 ──────────────────────────────────────────────
research:
  # 只有研究员能上网。没有实时信息的模型不可能赢过流动的预测市场 ——
  # 市场价里已经含了全部公开信息,模型能贡献的只有一个过时的先验。
  # (实测:第一版没给工具时 fable-5 自己就想去搜世界杯结果,把 turn 烧光后崩掉)
  #
  # 想彻底关掉研究就设成 [] —— 但那样投票人只能在无知上下注或永远弃权。
  #
  # 注意 RESEARCHER_SYSTEM 里明令禁止搜索赔率/Polymarket/博彩盘口 ——
  # 简报里一旦出现市场价,致盲就白做了,那三票是在拿市场衡量市场。
  researcher_tools:
    - WebSearch
    - WebFetch

  # --max-turns。踩过的坑:
  #   给 1 → --json-schema 的工具调用发不出去,直接 error_max_turns
  #   给 3 → 模型尝试 WebSearch 被拒也烧轮次,fable-5 在真实问题上必挂
  #          (opus-4-8 同参数却能过 —— 别拿单个模型的通过当验证)
  #   给 10 → haiku 研究员在搜索多的题材(体育赛程/加密价格)把 10 轮全烧在
  #          WebSearch 上,没轮到吐结构化输出。一天 3 次,每次 ~$0.1 白烧。
  max_turns: 14

  # 研究员挂了怎么办。true = 整个市场跳过 (宁可不做);
  # false = 让投票人在没有事实的情况下硬判 (它们大概率会低信心弃权,
  #         但万一没弃权就是在无知上下注)。
  skip_market_if_research_fails: true

# ── 市场筛选 (五层漏斗) ────────────────────────────────────
# 静态筛 → 冷却 → 打分 → 盘口体检 → 取前 N。前四层全是代码,零 LLM 成本。
#
# 这套是 24h 实测(98 轮全 SKIP)之后的改版。当时按成交量取前 3,71/98 轮
# 反复烧在同两个百万级世界杯盘上 —— 成交量大 = 盯的人多 = 定价最尖,
# 是结构性地在最没 edge 的地方找 edge。现在:掐掉巨量盘、放宽长尾、
# 记住分析过的、分析前先体检盘口。
market_filter:
  pages: 3                           # gamma 单页 100,翻 3 页看 300 个市场
  min_volume_24h_usd: 5000           # $5 的单要不了多少流动性,放宽长尾
  max_volume_24h_usd: 400000         # 掐掉巨量盘(定价太尖,没 edge)
  min_liquidity_usd: 5000
  # 价格区间仍是重要筛子:0.99 的已定盘没有 edge
  price_min: 0.10
  price_max: 0.90
  min_days_to_resolution: 1
  max_days_to_resolution: 45         # 从 120 收紧:结算快 = 反馈快 = 更快知道行不行
  max_markets_per_round: 3           # 每轮最多分析几个 (直接决定配额消耗)
  exclude_keywords: []               # 硬屏蔽,如 ["Ethiopia"]

  # 冷却:分析过且价格没动的盘,这么多小时内不再重复分析。
  # 价格挪动超过 reprice_threshold 提前解锁 —— 动了说明有新闻。持仓盘永不冷却。
  cooldown_hours: 8
  reprice_threshold: 0.04

  # 打分降权(不是屏蔽):单场对决被博彩公司定死价,24h 实测此类全部弃权
  deprioritize_keywords: ["vs."]

  # 盘口体检:分析前一个免费 HTTP 调用,筛掉成交不了的盘。
  # 堵的是 gamma 陈旧中间价陷阱(St. Louis 盘中间价 0.815,真实 bid 0.999
  # 无 ask —— 比赛早打完了,三个模型对着它"发现"了 -0.79 的假 edge)。
  book_max_spread: 0.06
  book_max_ask: 0.95

# ── 主循环 ────────────────────────────────────────────────
loop:
  # ⚠ 这个值和 llm.py 里的 ENABLE_PROMPT_CACHING_1H=1 是**一对**,别单独改。
  #
  #   45 分钟 < 60 分钟 TTL  →  上一轮写的缓存这一轮还能读到,系统提示那段
  #                             是 cache_read(≈0.1×)而不是 cache_write(≈1.25-2×)
  #   > 60 分钟              →  每轮都是冷启,cache_write 白付,从没人读
  #
  # 也就是说**拉长间隔反而更贵**(单轮成本上去了),这跟直觉相反。
  # 真要省配额,砍 max_markets_per_round,别动这个。
  #
  # 观测台的「Token 缓存命中率」面板就是盯这个的:间隔列显示 +45m 而状态
  # 还是「命中」,就是 1h TTL 生效的直接证据。
  interval_minutes: 45

# ── 交易执行 (仅 dry_run=false 时生效) ─────────────────────
execution:
  # 私钥不放这。从环境变量 POLYVOTE_PRIVATE_KEY 读。
  # Polymarket 代理钱包地址(如果用的话):
  funder_address: null
  # 1 = Email/Magic 登录的代理钱包, 2 = 浏览器钱包(MetaMask 等)
  signature_type: 1
  chain_id: 137                      # Polygon 主网
  clob_host: https://clob.polymarket.com
  order_type: GTC                    # GTC=挂单等成交, FOK=立即全成或撤

data:
  gamma_host: https://gamma-api.polymarket.com
  db_path: ./polyvote.db
