# Finite-cash holdout experiment.  Parameters are frozen at the timestamp below.
# This is a post-hoc hypothesis derived from the first observer sample, not a
# promoted strategy.  Only observations created after frozen_at_utc count.
schema: fast-cash-challenger-v1
experiment_id: favorite-price-holdout-v1
frozen_at_utc: 2026-07-24T15:12:32Z
hypothesis: Entries offered at 0.60 or above avoid the observer's miscalibrated mid-price loss cluster.

source_observer_pattern: fast_observer_{asset}.db
source_virtual_order_usd: 5.0
ledger_pattern: fast_challenger_favorite_v1_{asset}.db
state_path: fast_challenger_state.json
incident_path: fast_challenger_incident.json
poll_seconds: 2.0

total_capital_usd: 30.0
max_daily_loss_usd: 6.0
max_open_positions: 4
latch_on_daily_loss: true

rules:
  min_entry_price: 0.60
  min_selected_probability: 0.55
  min_net_edge: 0.04
  minimum_order_shares: 5.0
  max_orders_per_asset_window: 1

promotion_gate:
  minimum_settled: 500
  minimum_runtime_hours: 336
  requires_frozen_holdout: true

assets:
  - asset: BTC
    allocation_usd: 10.5
    max_order_usd: 4.25
    max_daily_loss_usd: 3.5
    minimum_cash_reserve_usd: 1.0
  - asset: ETH
    allocation_usd: 7.5
    max_order_usd: 3.75
    max_daily_loss_usd: 2.5
    minimum_cash_reserve_usd: 0.75
  - asset: SOL
    allocation_usd: 6.0
    max_order_usd: 3.5
    max_daily_loss_usd: 2.0
    minimum_cash_reserve_usd: 0.5
  - asset: XRP
    allocation_usd: 6.0
    max_order_usd: 3.5
    max_daily_loss_usd: 2.0
    minimum_cash_reserve_usd: 0.5
